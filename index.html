<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gaming Hub — Starter Website</title>
  <meta name="description" content="A beginner-friendly starter site for gaming news, guides, and game showcase." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #0f1724;
      --card: #0b1220;
      --muted: #9aa4b2;
      --accent: #7c5cff;
      --accent-2: #00d4ff;
      --glass: rgba(255,255,255,0.04);
      --radius: 12px;
      --max-width: 1100px;
      --glass-2: rgba(255,255,255,0.02);
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: linear-gradient(180deg,#071021 0%, #081827 50%, #041018 100%);
      color: #e6eef6;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.45;
      display:flex;
      justify-content:center;
      padding:32px 16px;
    }
    .container{
      width:100%;
      max-width:var(--max-width);
    }
 
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:28px;
    }
    .logo{
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color:inherit;
    }
    .logo svg{width:44px;height:44px;flex:0 0 44px}
    .logo h1{font-size:18px;margin:0;font-weight:700;letter-spacing:0.2px}
    nav{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .nav-link{
      color:var(--muted);
      text-decoration:none;
      padding:8px 12px;
      border-radius:8px;
      font-weight:600;
      font-size:14px;
    }
    .nav-link:hover{color:#fff;background:var(--glass)}
    .actions{display:flex;gap:8px;align-items:center}
    .btn{
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      border:none;color:#071424;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;
      box-shadow:0 6px 20px rgba(124,92,255,0.12);
    }
    .btn.ghost{
      background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);font-weight:600;
      box-shadow:none;
    }
 
    main{
      display:grid;
      gap:28px;
    }
 
    .hero{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      border-radius:var(--radius);
      padding:28px;
      display:grid;
      grid-template-columns:1fr 420px;
      gap:20px;
      align-items:center;
      backdrop-filter: blur(6px);
    }
    .hero h2{margin:0 0 8px 0;font-size:28px}
    .hero p{margin:0;color:var(--muted);font-size:15px}
    .hero .cta{display:flex;gap:12px;margin-top:18px}
    .hero-ill{
      display:flex;align-items:center;justify-content:center;
      background: linear-gradient(135deg, rgba(124,92,255,0.12), rgba(0,212,255,0.06));
      border-radius:12px;padding:18px;height:100%;
      box-shadow: inset 0 -6px 40px rgba(0,0,0,0.2);
    }
 
    /* Games grid */
    .section{
      background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
      border-radius:var(--radius);
      padding:20px;
      backdrop-filter: blur(6px);
    }
    .section h3{margin:0 0 12px 0}
    .games-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:12px;
    }
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:12px;
      display:flex;
      gap:12px;
      align-items:center;
      transition:transform .18s ease, box-shadow .18s ease;
      border:1px solid var(--glass-2);
    }
    .card:hover{transform:translateY(-6px);box-shadow:0 12px 40px rgba(2,6,23,0.6)}
    .thumb{width:86px;height:64px;border-radius:8px;flex:0 0 86px;display:flex;align-items:center;justify-content:center;color:#041018;font-weight:700}
    .meta{flex:1}
    .meta h4{margin:0 0 6px 0;font-size:15px}
    .meta p{margin:0;color:var(--muted);font-size:13px}
    .meta .tags{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
    .tag{background:rgba(255,255,255,0.02);padding:6px 8px;border-radius:999px;font-size:12px;color:var(--muted)}
 
    /* Guides & news */
    .grid-2{display:grid;grid-template-columns:1fr 360px;gap:12px}
    .accordion-item{border-radius:10px;padding:12px;background:transparent;border:1px solid var(--glass-2);margin-bottom:8px}
    .news-item{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.02)}
    .news-item:last-child{border-bottom:0}
    .muted{color:var(--muted);font-size:13px}
 
    /* Contact form */
    form{display:grid;gap:8px}
    label{font-size:13px;color:var(--muted)}
    input[type="text"],input[type="email"],textarea{
      background:transparent;border:1px solid rgba(255,255,255,0.04);padding:10px;border-radius:8px;color:inherit;
      outline:none;
    }
    textarea{min-height:100px;resize:vertical}
    .success{background:linear-gradient(90deg,#1a5b2f,#155a46);padding:10px;border-radius:8px;color:#dfffe6;font-weight:600}
 
    footer{margin-top:18px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.02)}
    .socials{display:flex;gap:10px}
 
    /* Modal */
    .modal{
      position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(2,6,23,0.6), rgba(2,6,23,0.9));padding:28px;
    }
    .modal.open{display:flex}
    .modal-card{background:linear-gradient(180deg,#041018,#071422);padding:18px;border-radius:12px;max-width:860px;width:100%;box-shadow:0 30px 80px rgba(2,6,23,0.8)}
    .modal-grid{display:grid;grid-template-columns:1fr 320px;gap:18px}
    .close-btn{background:transparent;border:0;color:var(--muted);cursor:pointer;font-weight:700}
 
    /* Responsive */
    @media (max-width:900px){
      .hero{grid-template-columns:1fr; text-align:center}
      .hero-ill{order:-1}
      .grid-2{grid-template-columns:1fr}
      .modal-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="container" id="top">
    <header role="banner">
      <a class="logo" href="#top" aria-label="Gaming Hub Home">
        <!-- Simple controller logo -->
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="6" width="20" height="12" rx="3" fill="#0b1220"/>
          <circle cx="7.5" cy="12" r="2" fill="#7c5cff"/>
          <rect x="15" y="10.25" width="3" height="1.5" rx="0.75" fill="#00d4ff"/>
          <path d="M2 13c4 4 10 4 14 0" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h1>Gaming Hub</h1>
      </a>
 
      <nav role="navigation" aria-label="Main navigation">
        <a class="nav-link" href="#games">Games</a>
        <a class="nav-link" href="#guides">Guides</a>
        <a class="nav-link" href="#news">News</a>
        <a class="nav-link" href="#about">About</a>
        <a class="nav-link" href="#contact">Contact</a>
      </nav>
 
      <div class="actions">
        <button class="btn ghost" id="themeToggle" aria-pressed="false" title="Toggle dark/light theme">Light</button>
        <button class="btn" id="addGameBtn">Add Game</button>
      </div>
    </header>
 
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div>
          <h2 id="hero-title">Welcome to Gaming Hub — Your Starter Site</h2>
          <p>A simple, extendable website template for showcasing games, publishing guides, and sharing news. No setup required — edit this file to begin.</p>
          <div class="cta">
            <a class="btn
