<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BakeryLink — Connect, Share, Bake</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --brand:#0a66c2;
      --muted:#6b7280;
      --bg:#f3f6fb;
      --card:#ffffff;
      --glass: rgba(255,255,255,0.6);
      --rounded:12px;
      --max-width:1100px;
      --shadow: 0 4px 14px rgba(15,23,42,0.08);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:linear-gradient(180deg,var(--bg),#ffffff);
      color:#0f172a;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding-top:64px;
    }
 
    /* Top Nav */
    .topbar{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:64px;
      background:var(--brand);
      display:flex;
      align-items:center;
      gap:16px;
      padding:0 18px;
      z-index:40;
      box-shadow: 0 1px 0 rgba(11,33,71,0.08);
    }
    .topbar .brand{
      display:flex;
      align-items:center;
      gap:10px;
      color:#fff;
      text-decoration:none;
      margin-right:8px;
    }
    .logo{
      width:36px;
      height:36px;
      border-radius:8px;
      background:linear-gradient(135deg,#ffd6a5,#ffb86b);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: inset 0 -2px 6px rgba(0,0,0,0.08);
      font-weight:700;
      color:#7a2a00;
      font-size:18px;
    }
    .brand .title{font-weight:700; font-size:16px; letter-spacing:0.2px}
    .search{
      flex:1;
      max-width:520px;
      display:flex;
      align-items:center;
      gap:8px;
      background:rgba(255,255,255,0.12);
      border-radius:10px;
      padding:6px 10px;
      color:#fff;
    }
    .search input{
      border:0;
      outline:0;
      background:transparent;
      color:#fff;
      font-size:14px;
      width:100%;
    }
    .nav-actions{
      display:flex;
      gap:6px;
      margin-left:8px;
      align-items:center;
    }
    .nav-btn{
      color:#cfe6ff;
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:8px;
      text-decoration:none;
      font-size:13px;
    }
    .nav-btn:hover{background:rgba(255,255,255,0.06); color:#fff}
    .nav-icon{
      width:18px;height:18px;display:inline-block;opacity:0.98;
    }
 
    /* Layout */
    .wrap{
      max-width:var(--max-width);
      margin:20px auto;
      display:grid;
      grid-template-columns:260px 1fr 320px;
      gap:18px;
      padding:12px;
    }
 
    /* Cards */
    .card{
      background:var(--card);
      border-radius:var(--rounded);
      box-shadow:var(--shadow);
      padding:14px;
    }
    .profile-card{
      text-align:center;
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
    }
    .avatar{
      width:84px;height:84px;border-radius:14px;background:linear-gradient(180deg,#fff,#f8efe6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;color:#7a2a00;box-shadow:0 6px 18px rgba(122,42,0,0.08);
    }
    .small{font-size:13px;color:var(--muted)}
 
    .connections{
      width:100%;
      display:flex;
      justify-content:space-between;
      gap:8px;
    }
    .connections .col{flex:1;text-align:center}
    .connections strong{display:block;font-size:16px}
 
    .sidebar-link{
      display:block;
      padding:10px 12px;
      border-radius:8px;
      color:#0f172a;
      text-decoration:none;
      margin-top:10px;
      border:1px solid rgba(15,23,42,0.04);
      background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(255,255,255,0.98));
    }
    .sidebar-link:hover{transform:translateY(-2px);transition:all 120ms ease}
 
    /* Main */
    .main .composer{
      display:flex;
      gap:12px;
      align-items:flex-start;
    }
    .composer .compose-avatar{width:56px;height:56px;border-radius:12px;background:linear-gradient(180deg,#fff,#f8efe6);display:flex;align-items:center;justify-content:center;font-weight:700;color:#7a2a00}
    .composer .compose-box{
      flex:1;
      border-radius:12px;
      border:1px solid rgba(15,23,42,0.06);
      padding:12px;
      background:linear-gradient(180deg, #fff, #fcfcfd);
    }
    .compose-box textarea{
      width:100%;
      min-height:64px;
      resize:vertical;
      border:0;
      outline:0;
      font-size:14px;
      font-family:inherit;
      padding:4px 0;
    }
    .compose-actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:8px;
    }
    .compose-actions .left{display:flex;gap:8px}
    .btn{
      background:var(--brand);
      color:#fff;
      border:0;
      padding:8px 12px;
      border-radius:8px;
      font-weight:600;
      cursor:pointer;
      font-size:14px;
    }
    .btn.secondary{background:#eef3fb;color:var(--brand);border:1px solid rgba(10,102,194,0.08)}
 
    .feed{margin-top:12px;display:flex;flex-direction:column;gap:14px}
    .post{
      padding:14px;
      border-radius:12px;
      background:linear-gradient(180deg,#fff,#fff);
      border:1px solid rgba(15,23,42,0.04);
    }
    .post-head{display:flex;gap:12px;align-items:center}
    .post-author{display:flex;flex-direction:column}
    .post-meta{font-size:13px;color:var(--muted)}
    .post-body{margin-top:10px;font-size:15px;line-height:1.45}
    .post-media{margin-top:10px;border-radius:10px;overflow:hidden}
    .post-media img{width:100%;height:auto;display:block}
 
    .post-actions{
      display:flex;
      gap:12px;
      margin-top:12px;
      align-items:center;
      color:var(--muted);
      font-size:14px;
    }
    .action{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:8px 10px;
      border-radius:8px;
      cursor:pointer;
    }
    .action:hover{background:rgba(15,23,42,0.03)}
    .action.liked{color:#c0262a;background:linear-gradient(90deg,#ffe3e3,#fff0f0);border:1px solid rgba(192,38,42,0.06)}
 
    /* Right sidebar */
    .sponsor{display:flex;flex-direction:column;gap:10px}
    .sponsor img{width:100%;border-radius:8px}
    .trend{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;background:linear-gradient(180deg,#fff,#fbfcff);border:1px solid rgba(15,23,42,0.03)}
    .trend strong{font-size:14px}
    .cta{
      display:block;
      margin-top:8px;
      padding:10px;
      border-radius:10px;
      text-decoration:none;
      text-align:center;
      background:linear-gradient(90deg,var(--brand),#0059a6);
      color:white;
      font-weight:700;
    }
 
    /* Footer */
    footer{max-width:var(--max-width);margin:24px auto;color:var(--muted);font-size:13px;text-align:center}
 
    /* Responsive */
    @media (max-width:980px){
      .wrap{grid-template-columns:1fr; padding:12px}
      .topbar .search{display:none}
      .nav-actions .nav-btn span{display:none}
      body{padding-top:72px}
    }
  </style>
</head>
