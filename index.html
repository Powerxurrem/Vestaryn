<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roast & Co — Coffee Shop</title>
  <meta name="description" content="Roast & Co — Cozy neighborhood coffee shop. Fresh brews, pastries, and a welcoming space to relax or work." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23a6633a'/%3E%3Ctext x='50' y='58' font-size='46' text-anchor='middle' fill='%23fff' font-family='Arial, Helvetica, sans-serif'%3ERO%3C/text%3E%3C/svg%3E" />
  <style>
    :root{
      --bg:#14110f;
      --panel:#1f1917;
      --muted:#d7c9c0;
      --accent:#c47a3a;
      --accent-2:#e9b68a;
      --glass: rgba(255,255,255,0.03);
      --radius:14px;
      --max-width:980px;
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:
        radial-gradient(800px 400px at 10% 20%, rgba(196,122,58,0.06), transparent 12%),
        radial-gradient(600px 300px at 90% 90%, rgba(233,182,138,0.04), transparent 10%),
        var(--bg);
      color: #fff6f0;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:28px;
      min-height:100vh;
    }
 
    .container{
      width:100%;
      max-width:var(--max-width);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      overflow:hidden;
    }
 
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:18px 22px;
      border-bottom:1px solid rgba(255,255,255,0.03);
      background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
    }
 
    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }
    .logo{
      width:52px;
      height:52px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      color:#2b1b12;
      box-shadow: 0 8px 26px rgba(196,122,58,0.14);
      flex:0 0 52px;
      font-size:18px;
    }
    .site-title{
      display:flex;
      flex-direction:column;
      line-height:1;
    }
    .site-title .name{
      font-weight:800;
      letter-spacing:0.2px;
      font-size:16px;
    }
    .site-title .tag{
      font-size:13px;
      color:var(--muted);
    }
 
    nav{
      display:flex;
      align-items:center;
      gap:10px;
    }
    nav a{
      text-decoration:none;
      color:var(--muted);
      padding:8px 12px;
      border-radius:10px;
      font-weight:700;
      transition:all .14s ease;
      display:inline-flex;
      gap:8px;
      align-items:center;
      font-size:14px;
    }
    nav a.primary{
      background: linear-gradient(90deg, rgba(196,122,58,0.14), rgba(233,182,138,0.06));
      color:#fff6ef;
      box-shadow: 0 6px 18px rgba(196,122,58,0.06);
    }
    nav a:hover{ transform:translateY(-2px); color:#fff6ef; }
 
    main{
      padding:26px;
    }
 
    .layout{
      display:grid;
      grid-template-columns: 1fr 320px;
      gap:24px;
      align-items:start;
    }
 
    @media (max-width:900px){
      body{padding:18px}
      .layout{grid-template-columns:1fr}
    }
 
    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
      border-radius:var(--radius);
      padding:18px;
      border:1px solid rgba(255,255,255,0.03);
    }
 
    /* Hero */
    .hero{
      display:flex;
      gap:18px;
      align-items:center;
    }
    .hero-art{
      width:140px;
      height:140px;
      border-radius:18px;
      background:linear-gradient(135deg,#40302a, #8e5a3a);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:60px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.6);
      flex:0 0 140px;
    }
    .hero h1{
      margin:0 0 8px 0;
      font-size:28px;
      line-height:1.05;
    }
    .hero p{
      margin:0;
      color:var(--muted);
      font-size:15px;
    }
    .cta-row{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .btn{
      display:inline-flex;
      gap:10px;
      align-items:center;
      border:0;
      color:#2b1b12;
      background:var(--accent-2);
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:800;
      text-decoration:none;
      transition:transform .12s ease, box-shadow .12s ease;
      box-shadow: 0 10px 28px rgba(233,182,138,0.14);
      font-size:14px;
    }
    .btn.ghost{
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      color:var(--muted);
      box-shadow:none;
      font-weight:700;
    }
    .btn:hover{ transform:translateY(-3px) }
 
    /* Menu list */
    .menu{
      margin-top:18px;
      display:grid;
      gap:12px;
      grid-template-columns:repeat(2,1fr);
    }
    @media (max-width:700px){ .menu{ grid-template-columns:1fr } }
 
    .menu-item{
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
      padding:12px;
      display:flex;
      gap:12px;
      align-items:center;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.02);
    }
    .menu-item .name{ font-weight:800; }
    .menu-item .desc{ font-size:13px; color:var(--muted); }
    .price{
      margin-left:auto;
      font-weight:800;
      color:var(--accent-2);
    }
 
    /* Sidebar */
    .sidebar{
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .hours{
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
    }
    .contact{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .input, textarea{
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      padding:10px 12px;
      border-radius:10px;
      color:inherit;
      outline:none;
      font-size:14px;
    }
    textarea{ min-height:80px; resize:vertical; }
 
    footer{
      padding:16px 22px;
      font-size:13px;
      color:var(--muted);
      border-top:1px solid rgba(255,255,255,0.03);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }
 
    .badge{
      background: linear-gradient(90deg, rgba(196,122,58,0.2), rgba(233,182,138,0.08));
      color:#fff6ef;
      padding:6px 10px;
      border-radius:999px;
      font-weight:800;
      font-size:13px;
    }
 
    .sr-only{ position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <div class="container" role="application" aria-labelledby="shop-name">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">R&C</div>
        <div class="site-title">
          <div id="shop-name" class="name">Roast & Co</div>
          <div class="tag">Neighborhood Coffee • Pastries • Good Vibes</div>
        </div>
      </div>
 
      <nav aria-label="Main navigation">
        <a href="#home" class="primary">Home</a>
        <a href="#menu">Menu
